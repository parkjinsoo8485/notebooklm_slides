<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>조선 야담 동화책</title>
  <link rel="stylesheet" href="storybook.css">
</head>
<body>
  <div class="storybook-page">
    <!-- 앤틱 프레임 장식 -->
    <div class="storybook-border-frame"></div>
    <div class="storybook-border-inner"></div>
    <div class="corner-ornament corner-tl"></div>
    <div class="corner-ornament corner-tr"></div>
    <div class="corner-ornament corner-bl"></div>
    <div class="corner-ornament corner-br"></div>

    <!-- 1. 상단 일러스트레이션 (70%) -->
    <div class="illustration-container">
      <img class="illustration-image" src="{{IMAGE_SRC}}" alt="동화 일러스트">
      <div class="illustration-vignette"></div>
    </div>

    <!-- 2. 하단 동화 텍스트 (30%) -->
    <div class="storybook-text-section">
      <div class="story-chapter-tag">{{CHAPTER_TITLE}}</div>
      <p class="story-narrative-text">{{STORY_TEXT}}</p>
      <div class="story-page-footer">❖ &nbsp; {{PAGE_NUMBER}} &nbsp; ❖</div>
    </div>
  </div>
</body>
</html>
